<body>
    <section class="seo-content" aria-label="About Pixie Bookhouse">
        <h1>Pixie Bookhouse</h1>
        <p>Visit the official website of Pixie Bookhouse — your go-to online secondhand bookstore. Transparent book condition, reasonable pricing. Read what you love.</p>
    </section>

    <iframe id="gas-iframe" title="Pixie Bookhouse web application" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe>

    <script>
        // Pixie Bookhouse Google Apps Script Web App URL
        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwV1CyusD_p5_UWcejTOQLpSkqIQzDEXF--YUCBaTA1W5LxUCWzvnf-Zvtbmm-UR1FV/exec';

        const iframe = document.getElementById('gas-iframe');

        // Build the full URL with preserved query parameters.
        // The hash is intentionally NOT forwarded — the embedded Apps Script
        // app reads its own hash via google.script.url, so passing it through
        // the parent URL only creates duplicated history entries.
        function buildIframeUrl() {
            let url = GAS_WEBAPP_URL;

            const params = new URLSearchParams(window.location.search);
            if (params.toString()) {
                url += '?' + params.toString();
            }

            return url;
        }

        const iframeUrl = buildIframeUrl();
        iframe.src = iframeUrl;

        // Bridge postMessage from the embedded app back to the wrapper so
        // the browser title bar and history reflect the current view.
        window.addEventListener('message', function(event) {
            if (event.origin !== 'https://script.google.com') return;

            if (event.data && event.data.type) {
                switch (event.data.type) {
                    case 'navigate':
                        if (event.data.url && event.data.url !== window.location.pathname) {
                            history.pushState(null, '', event.data.url);
                        }
                        break;
                    case 'setTitle':
                        if (event.data.title) {
                            document.title = event.data.title;
                        }
                        break;
                    case 'ready':
                        console.log('Pixie Bookhouse app is ready');
                        break;
                }
            }
        });

        // Forward browser back/forward to the embedded app
        window.addEventListener('popstate', function() {
            iframe.contentWindow.postMessage({
                type: 'popstate',
                url: window.location.href
            }, '*');
        });

        // Log successful setup (for debugging)
        console.log('Pixie Bookhouse wrapper loaded. Iframe URL:', iframeUrl);
    </script>
